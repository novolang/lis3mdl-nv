[package]
name        = "lis3mdl-nv"
version     = "0.1.0"
description = "A driver for ST's LIS3MDL three-axis magnetometer on an I2C or an SPI bus: the magnetic field in nanotesla, the four full scales, the performance modes and the output data rates, the data-ready line, the power modes, the self-test and WHO_AM_I, as devices-nv's Magnetometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["lis3mdl", "magnetometer", "compass", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/lis3mdl-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Reading a LIS3MDL magnetometer from a device program"

[dependencies]
# The board's I2C bus, SPI bus and GPIO handles, and the I2cBus, SpiBus
# and GpioOut traits they implement.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Magnetometer and Identifiable traits.
devices-nv      = "^0.3.2"
